name: coffeshop_mobile
description: "CHC Coffee House — order premium, freshly roasted coffee beans."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  dio: ^5.9.2

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  equatable: ^2.0.5
  flutter_riverpod: ^2.5.1

  dartz: ^0.10.1
  uuid: ^4.5.3
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.1.4
  webview_flutter: ^4.13.0
  local_auth: ^3.0.2
  light_sensor: ^3.0.2
  screen_brightness: ^2.1.11
  cached_network_image: ^3.4.1
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.14.4

# light_sensor 3.0.2's android/build.gradle uses a legacy per-module
# buildscript{} block with jcenter(), which AGP 9 (used by this project)
# can no longer evaluate. Vendored locally with that block stripped out
# since no fixed release exists upstream.
dependency_overrides:
  light_sensor:
    path: third_party/light_sensor

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon_preview.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Italic.ttf
          style: italic